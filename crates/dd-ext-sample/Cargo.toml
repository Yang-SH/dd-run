[package]
name = "dd-ext-sample"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "dd-run M0 示例扩展：以子进程身份响应 initialize / top_level_commands / close（契约来源：docs/protocol.md）"
publish = false

[dependencies]
dd-protocol = { path = "../dd-protocol" }
serde_json = "1"
# O4 可观测性：日志走 `log` facade，后端由 dd-protocol::logging 提供（恒 stderr）。
log = "0.4"
