[package]
name = "dd-run-cli"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "dd-run 开发自检 CLI（M0：扩展清单扫描与协议全链路自检；产物改名 dd-run-cli 以把 dd-run.exe 让给 GUI 宿主入口）"
publish = false

[dependencies]
# M9 B5：`--conformance` 对内置扩展改走 in-process（直驱 `dd_ext::serve_line`），
# 故需 dd-ext；协议类型（RawMessage/InitializeResult…）直接来自 dd-protocol。
dd-ext = { path = "../dd-ext" }
dd-host = { path = "../dd-host" }
dd-protocol = { path = "../dd-protocol" }
serde_json = "1"
