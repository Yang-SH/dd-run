[package]
name = "dd-ext"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "dd-run 共享扩展运行时：5 个内置扩展（Apps/Calc/System/WebSearch/Shell）共用的 JSON-RPC 服务端样板与命令注册模型（契约来源：docs/protocol.md；决策 D1-A 见 docs/m4-record.md §0）"
publish = false

[dependencies]
dd-protocol = { path = "../dd-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
fuzzy-matcher = "0.3"          # 文件名/路径模糊评分（纯 Rust，零 C 依赖）
chrono = "0.4"                  # 文件修改时间 → Unix 秒（近因加分；手搓 civil→days 易错，用成熟库保证正确）

# M6（apps.rs 对齐 PowerToys CmdPal）：
# - image[png]：HICON → GetDIBits → RgbaImage → PngEncoder 写 PNG（bytes），
#   复用 dd-gui 的 PNG 解码链路（resolve_icons）。仅启用 png，不开默认 features 全家桶。
# - windows-sys 0.61 features：
#   - `Win32_UI_Shell`：SHGetKnownFolderIDList/SHCreateItemFromIDList/SHCreateItemFromParsingName/
#     SHGetFileInfoW/SIGDN_*/SIIGBF_*/FOLDERID_AppsFolder/BHID_EnumItems（AppsFolder 应用本体枚举 + 图标抽取）；
#   - `Win32_UI_WindowsAndMessaging`：GetIconInfo / ICONINFO / DestroyIcon（HICON 拆位图与释放）；
#   - `Win32_Graphics_Gdi`：GetDIBits / BITMAPINFO / DeleteObject（位图→bytes）；
#   - `Win32_System_Com`：CoInitializeEx / CoTaskMemFree（Shell COM 初始化与 PIDL/PWSTR 释放）；
#   - `Win32_Foundation`：SIZE / HANDLE / HWND 占位；
#   - `Win32_Storage_FileSystem`：SHGetFileInfoW 的入参 FILE_FLAGS_AND_ATTRIBUTES 所在 module。
#   COM 接口结构（IShellItem/IEnumShellItems/IShellItemImageFactory）windows-sys 不生成，
#   在 apps.rs 内手绘 vtable（IID 为 shobjidl_core/thumbcache 稳定公开值）。
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # SHGetFileInfoW 的入参 FILE_FLAGS_AND_ATTRIBUTES 在此 module；
    # 不开则 SHGetFileInfoW 链接报 unresolved import
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # shell.rs：GetConsoleOutputCP（cmd 输出代码页，GBK 乱码修复）
    "Win32_System_Console",
    # shell.rs：MultiByteToWideChar（非 UTF-8 输出按代码页转码）
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# P2（everything-ipc 主通道，§9.2）：search.rs 直接连 Everything 的 IPC（WM_COPYDATA），
# 免每次按键 spawn es.exe 子进程；es.exe 降级为回落通道。
# - 仅 Windows：该 crate 直接 `use ::windows::...`，无平台守卫 → 必须放 windows target 段。
# - default-features=false：默认 feature 为空（不引入 tokio/pe/folder）——显式声明以免日后默认 feature 变化引入异步运行时。
# - 版本锁 =0.1.4：0.1.x 年更数版、API 可能变；docs.rs 快照存档，避免意外升级破坏编译。
everything-ipc = { version = "=0.1.4", default-features = false }

[[bin]]
name = "dd-ext-apps"
path = "src/bin/apps.rs"

[[bin]]
name = "dd-ext-calc"
path = "src/bin/calc.rs"

[[bin]]
name = "dd-ext-system"
path = "src/bin/system.rs"

[[bin]]
name = "dd-ext-websearch"
path = "src/bin/websearch.rs"

[[bin]]
name = "dd-ext-search"
path = "src/bin/search.rs"

[[bin]]
name = "dd-ext-shell"
path = "src/bin/shell.rs"
