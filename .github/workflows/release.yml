name: Release

# 批次 7.5：tag → 构建 → 免安装绿色包 zip → GitHub Release 附着。
# 分发形态（2026-09-08 定案，M9 起更新）：仅免安装单文件——dist/dd-run-<ver>.exe
# （5 内置扩展 in-process 内置于宿主进程，不再内嵌 exe）+ dist/extensions.d/（file-search
# sidecar），整体 zip，无安装器。
on:
  push:
    tags: ['v*']
  # O6 批次四：无 tag 手动触发（三平台构建验证；attach 步骤按事件类型跳过，
  # 不会创建/修改 Release）。
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  # O14/F12 批次二：发行方签名种子（仓库 secret：64 字符 hex 文件内容）。未配置
  # 时 package.sh 自动跳过 .sig 签发（构建照常，随包扩展回落信任同意流）。
  DDRUN_SIGN_KEY: ${{ secrets.DDRUN_SIGN_KEY }}

jobs:
  release:
    name: build + portable zip + GitHub Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # A1：覆盖仓库 rust-toolchain.toml（优先级高于 rustup default），锁 gnu
      # 宿主工具链（自带 self-contained 链接器），与 ci.yml Windows job 同语义。
      # 钉 1.98.0 理由见 ci.yml check job env 注记（1.95.0/1.99.1 的
      # rust-mingw dlltool 需外部汇编器且 self-contained 不含 as.exe）。
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-gnu
      # CI 基建修复（2026-10-31）：同 ci.yml check/snapshot——runner 镜像
      # 10-25 起预装 mingw 丢 sysroot，显式启用自带 self-contained CRT。
      RUSTFLAGS: -C link-self-contained=yes
    steps:
      # B4：fetch-depth 0 = 全历史 + tag——git-cliff 提交明细需要「自上个 tag
      # 以来」的完整提交区间（默认浅克隆只有 1 个 commit，明细必空）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # tag（vX.Y.Z）必须与根 Cargo.toml 的 workspace version 一致（5 个产品 crate 经
      # version.workspace 继承，此处即全部产品版本），防错发。
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 根 Cargo.toml（workspace 继承单一来源）版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (1.98.0-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-gnu
          # link-self-contained=yes 的载体（rust-mingw 在 minimal profile 下的
          # required 语义有版本出入，显式补装关闭该假设；已装则 no-op）。
          rustup component add rust-mingw

      # 终修（同 ci.yml check/snapshot，R4/R5 诊断定案）：dlltool 改指 choco
      # mingw-w64 + 精简集缺失的 libshlwapi.a 经独立 shim 目录追加 -L。
      - name: Install mingw-w64 toolchain (choco)
        run: choco install mingw -y --no-progress

      - name: Route -C dlltool to mingw-w64 dlltool (with self-test)
        run: |
          $dt = Get-ChildItem "C:\ProgramData\mingw64","C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter dlltool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dt) { $c = Get-Command dlltool.exe -ErrorAction SilentlyContinue; if ($c) { $dt = $c.Source } }
          if (-not $dt) { throw "mingw-w64 dlltool.exe not found after choco install" }
          Write-Host "dlltool = $dt"
          & $dt --version
          $t = "$env:TEMP\dt-verify"
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          Set-Content -Path "$t\kernel32.dll_imports.def" -Value "LIBRARY kernel32.dll`nEXPORTS`n  CreateMutexW"
          & $dt -d "$t\kernel32.dll_imports.def" -D kernel32.dll -l "$t\kernel32.dll_imports.lib" -m i386:x86-64 -f --64 --no-leading-underscore --temp-prefix kernel32.dll
          if ($LASTEXITCODE -ne 0) { throw "dlltool self-test exit = $LASTEXITCODE ($dt)" }
          $lib = Get-Item "$t\kernel32.dll_imports.lib" -ErrorAction SilentlyContinue
          if (-not $lib -or $lib.Length -eq 0) { throw "dlltool self-test produced no/empty import library ($dt)" }
          Write-Host "dlltool self-test OK ($($lib.Length) bytes)"
          $root = Split-Path (Split-Path $dt)
          $targetLib = Get-ChildItem $root -Recurse -Filter libshlwapi.a -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $targetLib) { throw "libshlwapi.a not found anywhere under $root (mingw-w64 layout drift?)" }
          $shim = "$env:TEMP\mingw-extra-libs"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          $exclude = @('libmsvcrt\.a$','libmingwex\.a$','libmingw32\.a$','libm\.a$','libgcc.*\.a$','libpthread\.a$','libwinpthread.*\.a$','libmoldname.*\.a$','libiconv\.a$','libstdc\+\+\.a$')
          $copied = Get-ChildItem $targetLib -Filter *.a | Where-Object { $n = $_.Name; -not ($exclude | Where-Object { $n -match $_ }) } | Copy-Item -Destination $shim -Force -PassThru
          if (-not $copied -or $copied.Count -lt 10) { throw "shim copy yielded only $(@($copied).Count) libs from $targetLib" }
          Write-Host "shim dir = $shim ($(@($copied).Count) import libs, CRT excluded)"
          Add-Content $env:GITHUB_ENV "RUSTFLAGS=-C link-self-contained=yes -C dlltool=$dt -C link-arg=-L$shim"
          Write-Host "RUSTFLAGS routed via GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # O14 密钥仪式配套（核对产出修正）：secret DDRUN_SIGN_KEY 存的是 64 字符
      # hex 种子**内容**，而 package.sh §6.5 签名钩子按**文件路径**消费（-f 判定
      # + --key 传参）——故先把 secret 落为 RUNNER_TEMP 下的临时文件（随 runner
      # 自动清理，不入产物、不打日志），再把 DDRUN_SIGN_KEY 重指为该路径。
      # secret 未配置时此步为空操作（package.sh 自动跳过签名，构建照常）。
      - name: Materialize signing key (secret content → temp file)
        if: env.DDRUN_SIGN_KEY != ''
        shell: bash
        run: |
          KEY_FILE="${RUNNER_TEMP}/ddrun-sign-key.hex"
          printf '%s' "${DDRUN_SIGN_KEY}" > "${KEY_FILE}"
          echo "DDRUN_SIGN_KEY=${KEY_FILE}" >> "$GITHUB_ENV"

      # §5.7：config.toml 不再钉扎 target——构建 target = RUSTUP_TOOLCHAIN 宿主
      # 三元组（windows-gnu）；gnu 工具链自带 self-contained 链接器（package.sh
      # 对 self-contained 仅作 PATH 兜底追加）。
      # dist/dev/ 下的 dd-run-cli/dd-ext-sample 是本机自检工具，不进发布 zip。
      - name: Build & package
        shell: bash
        run: bash tools/package.sh

      # zip 布局（解压即用）：dd-run-<ver>.exe + extensions.d/（清单 ${EXT_DIR}
      # 解析到本目录，自动定位 dd-ext-search.exe）。
      # 2026-10-17 收口批：内联 pwsh 逻辑抽出为**单一来源** tools/portable_zip.ps1
      # （package.sh Windows 分支亦调用它）——消除「本地只出 exe、zip 靠 CI 补」的
      # 成员集合漂移。条目名一律正斜杠（脚本内 .NET ZipArchive 显式指定，并自带
      # 反斜杠条目断言）。CI 保留显式一步，避免依赖 package.sh 内的 pwsh 探测。
      - name: Zip portable bundle
        shell: pwsh
        run: pwsh -NoProfile -File tools/portable_zip.ps1

      # B4（dd-run-改进分析.md）：Release body = 人手写的 Release Highlights
      # （下方 heredoc，**每次发版人工更新本次亮点小节**）+ git-cliff 自动生成的
      # 「提交明细」（自上个 tag 以来，cliff.toml 分组）。git-cliff 失败不阻塞
      # 发版（body 文件恒存在，仅缺明细段）。仓库内 CHANGELOG.md 是人工详账，
      # **不**被生成物覆盖（分析文档 B4 范围记档）。
      - name: Install git-cliff (prebuilt)
        if: github.event_name == 'push'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: git-cliff

      - name: Generate release body (highlights + git-cliff detail)
        if: github.event_name == 'push'
        shell: bash
        run: |
          cat > release_body.md <<'BODY'
          dd-run ${{ github.ref_name }} — 免安装绿色版（portable）

          **本次亮点（发版时人工更新）**

          - 解压后直接运行 `dd-run-<版本>.exe`（单文件，5 个内置扩展以 in-process 方式内置于宿主进程，无安装器）
          - `extensions.d/` 为文件搜索扩展 sidecar：与 exe 保持相对位置即可被自动发现（需本机装有 [Everything](https://www.voidtools.com/)）
          - 数据目录：`%APPDATA%\dd-run\`（设置 / 扩展清单 / 缓存 / 日志）；开机自启在应用内设置页开启
          - 完整变更台账见仓库 [CHANGELOG.md](https://github.com/Yang-SH/dd-run/blob/main/CHANGELOG.md)
          BODY
          {
            echo ""
            echo "---"
            echo ""
            echo "**提交明细（自上个 tag 起，自动生成）**"
            echo ""
            git-cliff --unreleased --strip all >> release_body.md || echo "（git-cliff 生成失败，明细缺失）"
          } >> release_body.md

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-portable.zip
          body_path: release_body.md

  # O6 批次四（2026-10-11）：Linux/macOS 发布产物——免安装单二进制 tar.gz
  # （optimization-plan §2.6.3）。filesearch sidecar 为 Windows 专属不随包
  # → 无签名面（package.sh 签名钩子仅 Windows 分支）。attach 按事件类型
  # 跳过（workflow_dispatch 仅验证构建，不创建/修改 Release）。
  release-linux:
    name: build + tar.gz (linux) + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A1：覆盖仓库 rust-toolchain.toml，维持工具链选择零变化。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 根 Cargo.toml（workspace 继承单一来源）版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # package.sh 非 Windows 分支：显式 --target 宿主三元组（§5.7 去 pin 后
      # 与宿主默认一致，保留为显式声明；与 ci.yml 门禁 CARGO_BUILD_TARGET 同语义），
      # 产出 dist/dd-run-<ver>-linux-<arch>.tar.gz。
      - name: Build & package (linux tar.gz)
        run: bash tools/package.sh

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-linux-*.tar.gz

  release-macos:
    name: build + tar.gz (macOS) + GitHub Release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # A1：同 release-linux——覆盖仓库 rust-toolchain.toml。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 根 Cargo.toml（workspace 继承单一来源）版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build & package (macOS tar.gz)
        run: bash tools/package.sh

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-macos-*.tar.gz

  # A2（dd-run-改进分析.md）：发布产物可验证性——三平台产物全部附着后，
  # 生成统一 SHA256SUMS.txt（覆盖全部资产，sha256sum -c 可验）并为本 run
  # 构建的产物生成 build provenance 出处证明（GitHub 原生 attestation，
  # 免费、无需证书；`gh attestation verify` 可验来源工作流与 commit）。
  release-sums:
    name: SHA256SUMS + build provenance
    needs: [release, release-linux, release-macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'dd-run-*-portable.zip' \
            --pattern 'dd-run-*-linux-*.tar.gz' \
            --pattern 'dd-run-*-macos-*.tar.gz' --dir dist
          ls -l dist

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum dd-run-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate build provenance (attestation)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/dd-run-*-portable.zip
            dist/dd-run-*-linux-*.tar.gz
            dist/dd-run-*-macos-*.tar.gz

      - name: Attach SHA256SUMS.txt to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/SHA256SUMS.txt
