name: Release

# 批次 7.5：tag → 构建 → 免安装绿色包 zip → GitHub Release 附着。
# 分发形态（2026-09-08 定案，M9 起更新）：仅免安装单文件——dist/dd-run-<ver>.exe
# （5 内置扩展 in-process 内置于宿主进程，不再内嵌 exe）+ dist/extensions.d/（file-search
# sidecar），整体 zip，无安装器。
on:
  push:
    tags: ['v*']
  # O6 批次四：无 tag 手动触发（三平台构建验证；attach 步骤按事件类型跳过，
  # 不会创建/修改 Release）。
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  # O14/F12 批次二：发行方签名种子（仓库 secret：64 字符 hex 文件内容）。未配置
  # 时 package.sh 自动跳过 .sig 签发（构建照常，随包扩展回落信任同意流）。
  DDRUN_SIGN_KEY: ${{ secrets.DDRUN_SIGN_KEY }}

jobs:
  release:
    name: build + portable zip + GitHub Release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # tag（ vX.Y.Z）必须与 crates/dd-gui/Cargo.toml 的 version 一致，防错发。
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' crates/dd-gui/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 crates/dd-gui/Cargo.toml 版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # O14 密钥仪式配套（核对产出修正）：secret DDRUN_SIGN_KEY 存的是 64 字符
      # hex 种子**内容**，而 package.sh §6.5 签名钩子按**文件路径**消费（-f 判定
      # + --key 传参）——故先把 secret 落为 RUNNER_TEMP 下的临时文件（随 runner
      # 自动清理，不入产物、不打日志），再把 DDRUN_SIGN_KEY 重指为该路径。
      # secret 未配置时此步为空操作（package.sh 自动跳过签名，构建照常）。
      - name: Materialize signing key (secret content → temp file)
        if: env.DDRUN_SIGN_KEY != ''
        shell: bash
        run: |
          KEY_FILE="${RUNNER_TEMP}/ddrun-sign-key.hex"
          printf '%s' "${DDRUN_SIGN_KEY}" > "${KEY_FILE}"
          echo "DDRUN_SIGN_KEY=${KEY_FILE}" >> "$GITHUB_ENV"

      # 仓库 .cargo/config.toml 默认 target = x86_64-pc-windows-gnu；gnu 工具链自带
      # self-contained 链接器（package.sh 对 self-contained 仅作 PATH 兜底追加）。
      # dist/dev/ 下的 dd-run-cli/dd-ext-sample 是本机自检工具，不进发布 zip。
      - name: Build & package
        shell: bash
        run: bash tools/package.sh

      # zip 布局（解压即用）：dd-run-<ver>.exe + extensions.d/（清单 ${EXT_DIR}
      # 解析到本目录，自动定位 dd-ext-search.exe）。
      # 条目名一律正斜杠：Compress-Archive 写反斜杠，被解压工具当成文件名字符
      # （出现 `extensions.d\com.ddrun.filesearch.json` 这类条目），故改用 .NET
      # ZipArchive 显式指定（与 T11 批本地便携包同口径，3 成员）。
      - name: Zip portable bundle
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/dd-gui/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $zip = "dist/dd-run-$ver-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, "dist/dd-run-$ver.exe", "dd-run-$ver.exe",
              [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            Get-ChildItem "dist/extensions.d" -File | ForEach-Object {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive, $_.FullName, "extensions.d/$($_.Name)",
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }
          Get-ChildItem dist -Filter *.zip | Select-Object Name, Length
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          $z.Entries | ForEach-Object { "  {0}  {1} B" -f $_.FullName, $_.Length }
          $z.Dispose()

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-portable.zip
          body: |
            dd-run ${{ github.ref_name }} — 免安装绿色版（portable）

            **本次亮点（自 v0.2.0 起）**

            - **跨平台（O6）**：macOS / Linux 免安装包首发（`dd-run-<ver>-linux-<arch>.tar.gz` / `dd-run-<ver>-macos-<arch>.tar.gz`，单二进制 + 运行时依赖说明，CI 门禁预览版）；三平台阻塞 CI 门禁（build / test / conformance / roundtrip）；全局热键接入 `global-hotkey`（Linux 仅 X11，Wayland 降级）、单实例互斥（Unix socket）
            - **扩展签名（O14）全链落地**：发行方 Ed25519 真钥——本包 `extensions.d/` 内随附有效 `.sig`，随包扩展验签通过即免信任同意（`.sig` 与清单保持相对位置即可）
            - 修复：热键重注册降级分支事件契约偏差；CI 签名 secret 错配；`dist/dev` 自检工具陈旧
            - ⚠️ Windows 便携包单件较 0.2.0 约 **+1.2%**（扩展签名链增量）；文件搜索扩展仍需 [Everything](https://www.voidtools.com/)（仅 Windows）

            - 解压后直接运行 `dd-run-<版本>.exe`（单文件，5 个内置扩展以 in-process 方式内置于宿主进程，无安装器）
            - `extensions.d/` 为文件搜索扩展 sidecar：与 exe 保持相对位置即可被自动发现（需本机装有 [Everything](https://www.voidtools.com/)）
            - 数据目录：`%APPDATA%\dd-run\`（设置 / 扩展清单 / 缓存）；开机自启在应用内设置页开启

  # O6 批次四（2026-10-11）：Linux/macOS 发布产物——免安装单二进制 tar.gz
  # （optimization-plan §2.6.3）。filesearch sidecar 为 Windows 专属不随包
  # → 无签名面（package.sh 签名钩子仅 Windows 分支）。attach 按事件类型
  # 跳过（workflow_dispatch 仅验证构建，不创建/修改 Release）。
  release-linux:
    name: build + tar.gz (linux) + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' crates/dd-gui/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 crates/dd-gui/Cargo.toml 版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # package.sh 非 Windows 分支：显式 --target 宿主三元组（覆盖 config.toml
      # 的 windows-gnu 硬编码，与 ci.yml 门禁 CARGO_BUILD_TARGET 同语义），
      # 产出 dist/dd-run-<ver>-linux-<arch>.tar.gz。
      - name: Build & package (linux tar.gz)
        run: bash tools/package.sh

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-linux-*.tar.gz

  release-macos:
    name: build + tar.gz (macOS) + GitHub Release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' crates/dd-gui/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate version = ${VER}, tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 crates/dd-gui/Cargo.toml 版本 v${VER} 不一致"
            exit 1
          fi

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build & package (macOS tar.gz)
        run: bash tools/package.sh

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/dd-run-*-macos-*.tar.gz
