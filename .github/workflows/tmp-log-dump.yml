name: tmp-log-dump
on:
  push:
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fetch failed job log (run 37323312785 / job 111807611099)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/Yang-SH/dd-run/actions/jobs/111807611099/logs -o full.txt
          { echo "log-bytes: $(wc -c < full.txt)";
            grep -nE "FAILED|failures:|panicked at|test result:|error:" full.txt | head -40; } > excerpt.txt || true
          tail -60 full.txt >> excerpt.txt || true
      - name: commit excerpt
        run: |
          git config user.name "dd-run-bot"
          git config user.email "bot@dd-run.local"
          git add excerpt.txt
          git commit -m "chore(tmp): CI 58 log excerpt [tmp-log-dump]"
          git push
