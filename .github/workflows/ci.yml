name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build / test / clippy / fmt (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A1：仓库 rust-toolchain.toml（channel 1.95.0）优先级高于 `rustup default`
      # ——本 job 必须锁 gnu 宿主工具链（自带 self-contained 链接器，见下），
      # 用 RUSTUP_TOOLCHAIN 显式覆盖（该变量优先于 rust-toolchain.toml）。
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy rustfmt

      # P2-4.5（2026-10-25 核对轮）：rustc 对 windows-gnu 的 raw-dylib 导入库生成
      # 需 dlltool.exe，其位置在工具链 bin/self-contained/ 子目录——部分 rustc
      # 版本（本机 1.98.0 实测）只按 PATH 查找。追加进 GITHUB_PATH；若 runner
      # 工具链本就无需 dlltool 则为无害 no-op。
      - name: Ensure dlltool discoverable (raw-dylib, windows-gnu)
        run: >
          Add-Content $env:GITHUB_PATH
          "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # §5.7：config.toml 不再钉扎 build.target——构建 target = RUSTUP_TOOLCHAIN
      # 的宿主三元组（windows-gnu）；rustup 的 gnu 工具链自带 self-contained
      # 链接器，runner 无需外部 mingw。
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # 机器相关的 Steam 测试已更名 machine_steam_... 且 #[ignore]（apps.rs，
      # P8 收口：本机断言由维护者 `cargo test -p dd-ext -- --ignored machine_`
      # 真机覆盖），CI 无例外全跑。
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # O13（2026-10-17）：文档一致性收口门——跨文件链接可达 + INDEX 行数登记 +
      # 文档引用文件存在性（仓库根相对路径，高精度低噪音）。与项目「文档回写
      # 六处」第⑥步同源，任一漂移 exit 1。
      - name: Docs consistency (docscan)
        run: node tools/docscan.mjs

  # O3 依赖治理（docs/optimization-plan.md §2.5）：与平台无关，放 linux runner 最快。
  # - cargo-audit：RustSec 漏洞扫描，发现 vulnerability 即失败（默认门槛；unmaintained/
  #   informational 只警告不阻塞，避免第三方仓库的软性告警卡死 CI）。
  # - cargo-machete：死依赖检测（O3 原方案是 cargo-udeps，但它需要 nightly 工具链且
  #   每次冷编译整个依赖树，CI 成本高；machete 基于 identifier 匹配、stable 秒级，
  #   对本项目规模足够——若出现误报，用 workspace 层的 [package.metadata.ignore] 豁免）。
  audit:
    name: dependencies (audit + machete)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit & cargo-machete (prebuilt)
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-machete

      - name: Security audit (RustSec advisory-db)
        run: cargo audit

      - name: Unused dependencies
        run: cargo machete

  # O6 首批（2026-10-11）：三方平台构建矩阵——build/test/conformance 在
  # ubuntu/macOS 为**阻塞门禁**（探索轮两处平台缺口修复后全绿，已摘
  # continue-on-error）。clippy/fmt 仍以 Windows 门禁为准（避免跨平台 lint
  # 噪音稀释既有门禁语义）。
  check-linux:
    name: build / test (linux, O6 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致，保留为防漂移的显式声明；
      # 历史：config.toml 曾硬编码 windows-gnu，无此覆盖则连 std 都没有——E0463）。
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      # A1：覆盖仓库 rust-toolchain.toml（其优先级高于 `rustup default`），
      # 维持 unix job 工具链选择零变化。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # A3（dd-run-改进分析.md）：跨平台 clippy 门禁——Windows 专属代码在
      # unix 下的死代码/未用导入已当批清零（41 条），自此三平台同门禁。
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc

      - name: Roundtrip smoke (spawn, sample extension)
        run: cargo run -p dd-run-cli -- --roundtrip

  # B1（dd-run-改进分析.md §3.2）：UI 快照金图 job——只在本 job 显式跑
  # （`-- --ignored`；快照测试已标 #[ignore]，常规 test/clippy 不触 wgpu）。
  # Windows runner 走 DX12 WARP 软件适配器。**continue-on-error 先行观察**：
  # 金图为本机 GPU 生成，WARP 与本地 GPU 的像素一致性未经实测——首绿后摘除
  # 本标记转为阻塞门禁（届时若像素漂移，在 kittest.toml 调阈值或以 CI 出图）。
  snapshot:
    name: UI snapshots (windows, WARP)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      # 同 check（windows-gnu）：覆盖仓库 rust-toolchain.toml。
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy rustfmt

      # 同 check：raw-dylib 的 dlltool 查找防御（快照测试同样编译 dev 依赖链）。
      - name: Ensure dlltool discoverable (raw-dylib, windows-gnu)
        run: >
          Add-Content $env:GITHUB_PATH
          "$env:USERPROFILE\.rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\bin\self-contained"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Snapshot tests (golden comparison)
        run: cargo test -p dd-gui --lib snapshot -- --ignored

  # §4.5（dd-run-改进分析.md）：性能趋势回归——PR base 与 head 各跑一遍
  # criterion bench（fast 参数压时长），共享 CARGO_TARGET_DIR 后用
  # tools/bench_compare.mjs 比中位数，退化 >20% 才红（runner 裸机噪音大，
  # 高阈值防误报）。**continue-on-error 观察模式**：runner 噪音分布未经
  # 实测，首绿观察后转阻塞（与 B1 snapshot 同节奏）；仅 PR 触发（push 全量
  # 跑双份 bench 纯烧时间，main 上的性能回归由 PR 阶段拦下）。
  bench:
    name: perf trend (linux, base vs head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event_name == 'pull_request'
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致）+ 覆盖 rust-toolchain.toml。
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Checkout PR base as sibling worktree
        run: git worktree add ../dd-run-base "${{ github.event.pull_request.base.sha }}"

      # 两棵树共用绝对 target 目录：依赖只编一次，两份基线落同一 criterion/ 下。
      - name: Bench (PR base)
        run: >
          cd ../dd-run-base &&
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench
          -p dd-gui -p dd-protocol --bench hot_paths --bench decoder --
          --save-baseline base --warm-up-time 1 --measurement-time 2 --sample-size 20

      - name: Bench (PR head)
        run: >
          cargo bench
          -p dd-gui -p dd-protocol --bench hot_paths --bench decoder --
          --save-baseline head --warm-up-time 1 --measurement-time 2 --sample-size 20

      - name: Compare medians (>20% regression fails)
        run: node tools/bench_compare.mjs target/criterion base head --threshold 20

  check-macos:
    name: build / test (macos, O6 gate)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致，保留为防漂移的显式声明）。
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      # A1：同 check-linux——覆盖仓库 rust-toolchain.toml，维持零变化。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # A3：同 check-linux——三平台 clippy 同门禁（aarch64-apple-darwin 已实测 0 告警）。
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc

      - name: Roundtrip smoke (spawn, sample extension)
        run: cargo run -p dd-run-cli -- --roundtrip
