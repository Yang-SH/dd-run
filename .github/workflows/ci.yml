name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build / test / clippy / fmt (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 仓库 .cargo/config.toml 默认 target = x86_64-pc-windows-gnu，
      # rustup 的 gnu 工具链自带 self-contained 链接器，runner 无需外部 mingw。
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # 机器相关的 Steam 测试已更名 machine_steam_... 且 #[ignore]（apps.rs，
      # P8 收口：本机断言由维护者 `cargo test -p dd-ext -- --ignored machine_`
      # 真机覆盖），CI 无例外全跑。
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # O3 依赖治理（docs/optimization-plan.md §2.5）：与平台无关，放 linux runner 最快。
  # - cargo-audit：RustSec 漏洞扫描，发现 vulnerability 即失败（默认门槛；unmaintained/
  #   informational 只警告不阻塞，避免第三方仓库的软性告警卡死 CI）。
  # - cargo-machete：死依赖检测（O3 原方案是 cargo-udeps，但它需要 nightly 工具链且
  #   每次冷编译整个依赖树，CI 成本高；machete 基于 identifier 匹配、stable 秒级，
  #   对本项目规模足够——若出现误报，用 workspace 层的 [package.metadata.ignore] 豁免）。
  audit:
    name: dependencies (audit + machete)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit & cargo-machete (prebuilt)
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-machete

      - name: Security audit (RustSec advisory-db)
        run: cargo audit

      - name: Unused dependencies
        run: cargo machete

  # O6 首批（2026-10-11）：三方平台构建矩阵探索批——build/test 在 ubuntu/macOS
  # 上跑通即达成首个可交付物（conformance 类自检随后续批次接入）。**非阻塞**
  # （continue-on-error）：Linux/macOS 的 GUI 系统依赖（dlopen 系）与平台差异
  # 首轮可能红，探索收敛后移除本开关并升级为门禁。clippy/fmt 仍以 Windows 门禁
  # 为准（避免跨平台 lint 噪音稀释既有门禁语义）。
  check-linux:
    name: build / test (linux, O6 exploratory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: cargo test --workspace

  check-macos:
    name: build / test (macos, O6 exploratory)
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: cargo test --workspace
