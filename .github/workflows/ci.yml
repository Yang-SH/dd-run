name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build / test / clippy / fmt (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A1：仓库 rust-toolchain.toml（channel 1.95.0 = MSRV）优先级高于
      # `rustup default`——本 job 必须锁 gnu 宿主工具链（自带 self-contained
      # 链接器，见下），用 RUSTUP_TOOLCHAIN 显式覆盖（该变量优先于
      # rust-toolchain.toml）。
      # 钉 1.98.0 而非浮动 stable / MSRV 1.95.0（2026-10-31 两轮 CI + 本机
      # 逐一考古实证）：rust-mingw 在 1.95.0 与 1.99.1 的 self-contained
      # 目录均不含 as.exe（本地列目录实证），其 dlltool（binutils 2.42）
      # 生成 raw-dylib 导入库需 CreateProcess 外部汇编器，找不到即静默死
      # （EXIT=1 / 0 字节 .lib，两个版本本机均复现，与 runner 签名一致；
      # PATH 垫 as.exe / 三元组前缀 shim 均救不回——非 PATH 查找）；1.98.0
      # （binutils 2.44）dlltool 自足，最小 PATH 亦过。镜像浮动 stable
      # （10-31 时点 1.99.1）与此一并免疫。MSRV 1.95 由 rust-toolchain.toml
      # 保有，本机 1.95.0-gnu 全量 check 已单独验证（台账记档）。
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-gnu
      # CI 基建修复（2026-10-31）：runner 镜像 10-25 前后变更，PATH 上的
      # x86_64-w64-mingw32-gcc 丢失自家 sysroot（crt2.o / crtbegin.o /
      # -lkernel32 全部 not found，纯 docs 提交也红——非代码回归）。显式启用
      # rustup gnu 工具链自带的 self-contained CRT（crt2.o / libkernel32.a /
      # libmingwex.a 等全套随 rust-mingw 分发，本地列目录实证齐全；flag 注入
      # -B self-contained 引用路径已本地机制实证），链接不再依赖 runner 预装
      # mingw 的完整性。
      RUSTFLAGS: -C link-self-contained=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (1.98.0-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-gnu
          # link-self-contained=yes 的载体（rust-mingw 在 minimal profile 下的
          # required 语义有版本出入，显式补装关闭该假设；已装则 no-op）。
          rustup component add rust-mingw
          rustup component add clippy rustfmt

      # 终修（2026-10-31 四轮考古定案，诊断步证据见 run 41152821754）：runner
      # 的 rust-mingw self-contained = 精简集（dlltool / ld / gcc-wrapper /
      # libwinpthread，无 as.exe 无 libintl-8 / libzstd / zlib1——诊断步列目录
      # 实证；本机同 commit hash 的 1.98.0 却为全量 10 项），dlltool(2.44)
      # 生成 raw-dylib 导入库须 spawn as → CreateProcess 失败 → exit 1 / 0 字
      # 节 .lib。改指 choco mingw-w64（niXman 16.1.0）：dlltool + as + 全部
      # DLL 同目录自足；安装后运行时搜索实际落盘路径（choco 布局随版本漂移，
      # 硬编码已在 R4 实证失效）并做真实 def 自测，失败明文报错。
      # link-self-contained=yes 保留（CRT / 链接器腿四轮 CI 实证可用）。
      - name: Install mingw-w64 toolchain (choco)
        run: choco install mingw -y --no-progress

      - name: Route -C dlltool to mingw-w64 dlltool (with self-test)
        run: |
          $dt = Get-ChildItem "C:\ProgramData\mingw64","C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter dlltool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dt) { $c = Get-Command dlltool.exe -ErrorAction SilentlyContinue; if ($c) { $dt = $c.Source } }
          if (-not $dt) { throw "mingw-w64 dlltool.exe not found after choco install" }
          Write-Host "dlltool = $dt"
          & $dt --version
          $t = "$env:TEMP\dt-verify"
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          Set-Content -Path "$t\kernel32.dll_imports.def" -Value "LIBRARY kernel32.dll`nEXPORTS`n  CreateMutexW"
          & $dt -d "$t\kernel32.dll_imports.def" -D kernel32.dll -l "$t\kernel32.dll_imports.lib" -m i386:x86-64 -f --64 --no-leading-underscore --temp-prefix kernel32.dll
          if ($LASTEXITCODE -ne 0) { throw "dlltool self-test exit = $LASTEXITCODE ($dt)" }
          $lib = Get-Item "$t\kernel32.dll_imports.lib" -ErrorAction SilentlyContinue
          if (-not $lib -or $lib.Length -eq 0) { throw "dlltool self-test produced no/empty import library ($dt)" }
          Write-Host "dlltool self-test OK ($($lib.Length) bytes)"
          # R5/R6 实证（run 41153531585 / 41154617400）：runner 精简 rust-mingw
          # 的导入库集被裁剪（ld: cannot find -lshlwapi；本机同版本全量集含
          # 40+ .a 且有 libshlwapi.a），且 choco 布局为目标 sysroot 子目录
          # （mingw64\x86_64-w64-mingw32\lib\，非 mingw64\lib\）。以
          # libshlwapi.a 为锚定位后拷贝全部**非 CRT**导入库入独立 shim 目录：
          # CRT 关键集（msvcrt / mingwex / gcc 系 / pthread / moldname /
          # iconv / stdc++）显式排除——crt2.o 与 CRT 仍全走 rustup
          # self-contained（choco 16.1.0 为 UCRT 变体，整链接器换道会与 rust
          # std 的 MSVCRT 运行时混用，红线）；Win32 API 导入库 = 纯系统 DLL
          # 桩，两工具链语义等同，多拷零风险，一次性消灭逐库补拷。
          $root = Split-Path (Split-Path $dt)
          $slim = "$env:USERPROFILE\.rustup\toolchains\1.98.0-x86_64-pc-windows-gnu\lib\rustlib\x86_64-pc-windows-gnu\lib\self-contained"
          Write-Host "rust-mingw lib\self-contained: $((Get-ChildItem $slim -Filter *.a -ErrorAction SilentlyContinue).Count) .a files; libshlwapi.a present = $(Test-Path "$slim\libshlwapi.a")"
          $targetLib = Get-ChildItem $root -Recurse -Filter libshlwapi.a -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $targetLib) { throw "libshlwapi.a not found anywhere under $root (mingw-w64 layout drift?)" }
          Write-Host "target lib dir = $targetLib"
          $shim = "$env:TEMP\mingw-extra-libs"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          $exclude = @('libmsvcrt\.a$','libmingwex\.a$','libmingw32\.a$','libm\.a$','libgcc.*\.a$','libpthread\.a$','libwinpthread.*\.a$','libmoldname.*\.a$','libiconv\.a$','libstdc\+\+\.a$')
          $copied = Get-ChildItem $targetLib -Filter *.a | Where-Object { $n = $_.Name; -not ($exclude | Where-Object { $n -match $_ }) } | Copy-Item -Destination $shim -Force -PassThru
          if (-not $copied -or $copied.Count -lt 10) { throw "shim copy yielded only $(@($copied).Count) libs from $targetLib" }
          Write-Host "shim dir = $shim ($(@($copied).Count) import libs, CRT excluded)"
          Add-Content $env:GITHUB_ENV "RUSTFLAGS=-C link-self-contained=yes -C dlltool=$dt -C link-arg=-L$shim"
          Write-Host "RUSTFLAGS routed via GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # §5.7：config.toml 不再钉扎 build.target——构建 target = RUSTUP_TOOLCHAIN
      # 的宿主三元组（windows-gnu）；rustup 的 gnu 工具链自带 self-contained
      # 链接器，runner 无需外部 mingw。
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # 机器相关的 Steam 测试已更名 machine_steam_... 且 #[ignore]（apps.rs，
      # P8 收口：本机断言由维护者 `cargo test -p dd-ext -- --ignored machine_`
      # 真机覆盖），CI 无例外全跑。
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      # O13（2026-10-17）：文档一致性收口门——跨文件链接可达 + INDEX 行数登记 +
      # 文档引用文件存在性（仓库根相对路径，高精度低噪音）。与项目「文档回写
      # 六处」第⑥步同源，任一漂移 exit 1。
      - name: Docs consistency (docscan)
        run: node tools/docscan.mjs

  # O3 依赖治理（docs/optimization-plan.md §2.5）：与平台无关，放 linux runner 最快。
  # - cargo-audit：RustSec 漏洞扫描，发现 vulnerability 即失败（默认门槛；unmaintained/
  #   informational 只警告不阻塞，避免第三方仓库的软性告警卡死 CI）。
  # - cargo-machete：死依赖检测（O3 原方案是 cargo-udeps，但它需要 nightly 工具链且
  #   每次冷编译整个依赖树，CI 成本高；machete 基于 identifier 匹配、stable 秒级，
  #   对本项目规模足够——若出现误报，用 workspace 层的 [package.metadata.ignore] 豁免）。
  # - cargo-deny（清单 §2.1，2026-10-30）：许可证 + bans 门禁——校验对象是 Cargo.lock，
  #   与平台无关，audit job 单点执行即代表三平台。允许清单 = deny.toml（仓库根目录）
  #   实测最小集，逐条审批理由在文件内注记；`cargo deny check licenses bans` 直接
  #   阻塞（无 continue-on-error）。工具经 install-action 预编译安装（cargo-deny 在其
  #   支持清单内，2026-10-30 对 TOOLS.md 实证——计划撰写时的 manifests 未核验不确定性就此消除）。
  audit:
    name: dependencies (audit + deny + machete)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit & cargo-deny & cargo-machete (prebuilt)
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete

      - name: Security audit (RustSec advisory-db)
        run: cargo audit

      - name: Unused dependencies
        run: cargo machete

      # 清单 §2.1（2026-10-30）：许可证 + bans 门禁，直接阻塞（无
      # continue-on-error）。deny.toml = 仓库根目录实测最小集（本机
      # `cargo deny check licenses bans` exit 0 先证，2026-10-28/30 两轮）；
      # 新增依赖引入清单外许可证 → 此处 fail，须在 deny.toml 逐条审批后扩充。
      - name: Licenses & bans (cargo-deny)
        run: cargo deny check licenses bans

  # O6 首批（2026-10-11）：三方平台构建矩阵——build/test/conformance 在
  # ubuntu/macOS 为**阻塞门禁**（探索轮两处平台缺口修复后全绿，已摘
  # continue-on-error）。clippy/fmt 仍以 Windows 门禁为准（避免跨平台 lint
  # 噪音稀释既有门禁语义）。
  check-linux:
    name: build / test (linux, O6 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致，保留为防漂移的显式声明；
      # 历史：config.toml 曾硬编码 windows-gnu，无此覆盖则连 std 都没有——E0463）。
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      # A1：覆盖仓库 rust-toolchain.toml（其优先级高于 `rustup default`），
      # 维持 unix job 工具链选择零变化。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # A3（dd-run-改进分析.md）：跨平台 clippy 门禁——Windows 专属代码在
      # unix 下的死代码/未用导入已当批清零（41 条），自此三平台同门禁。
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc

      - name: Roundtrip smoke (spawn, sample extension)
        run: cargo run -p dd-run-cli -- --roundtrip

      # P2-5.4（未完善事项清单 §4.2）：脚手架端到端——「零基础用户 --ext-new 生成
      # → --conformance 绿灯」的 CI 客观锚（ubuntu 自带 python3，首用即验；
      # start 已由脚手架设 0o755，POSIX 清单 entry = ${EXT_DIR}/start 开箱即绿）。
      - name: Scaffold end-to-end (--ext-new → --conformance)
        run: |
          cargo run -p dd-run-cli -- --ext-new com.example.demo --extensions-dir /tmp/ext-demo
          cargo run -p dd-run-cli -- --conformance --ext-id com.example.demo --extensions-dir /tmp/ext-demo

  # B1（dd-run-改进分析.md §3.2）：UI 快照金图 job——只在本 job 显式跑
  # （`-- --ignored`；快照测试已标 #[ignore]，常规 test/clippy 不触 wgpu）。
  # Windows runner 走 DX12 WARP 软件适配器。**continue-on-error 先行观察**：
  # 金图为本机 GPU 生成，WARP 与本地 GPU 的像素一致性未经实测——首绿后摘除
  # 本标记转为阻塞门禁（届时若像素漂移，在 kittest.toml 调阈值或以 CI 出图）。
  snapshot:
    name: UI snapshots (windows, WARP)
    # 钉 windows-2022（2026-10-31 R7 实证定案）：金图（618fee2，10-25）最后一次
    # CI 绿 = 旧 windows-latest 镜像的 WARP 渲染；10-25 镜像轮换后新 WARP 的
    # 文字光栅化漂移 ~700 像素/图（R7 直方图：阈值 10.0 仍 706 失败 = 非_AA 噪音
    # 的真实像素差）。本机对金图 6/6 全绿（批次零嫌疑）→ 漂移在 runner 侧。
    # 钉回旧镜像环境使金图零改动复配、本地与 CI 同族；比 max_failed_pixels
    # 容差（kittest 文档红线：>10 即可遮真实回归）与「金图正典迁移 CI」
    # （本地 opt-in 比对永久失配）两案更优。若 2022 镜像退役 → 金图需随
    # 新正典环境重生成（UPDATE_SNAPSHOTS=1），回写时记档。
    runs-on: windows-2022
    timeout-minutes: 30
    continue-on-error: true
    env:
      # 同 check（windows-gnu）：覆盖仓库 rust-toolchain.toml；钉 1.98.0 理由
      # 见 check job env 注记（1.95.0/1.99.1 的 rust-mingw dlltool 需外部
      # 汇编器且 self-contained 不含 as.exe，1.98.0 自足）。
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-gnu
      # CI 基建修复（2026-10-31）：同 check job——显式启用自带 self-contained
      # CRT，链接不再依赖 runner 预装 mingw 的完整性（10-25 起镜像漂移）。
      RUSTFLAGS: -C link-self-contained=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (1.98.0-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-gnu
          # link-self-contained=yes 的载体（rust-mingw 在 minimal profile 下的
          # required 语义有版本出入，显式补装关闭该假设；已装则 no-op）。
          rustup component add rust-mingw
          rustup component add clippy rustfmt

      # 终修（同 check job，R4/R5 诊断定案）：dlltool 改指 choco mingw-w64 +
      # 精简集缺失的 Win32 导入库（libshlwapi.a）经独立 shim 目录追加 -L。
      - name: Install mingw-w64 toolchain (choco)
        run: choco install mingw -y --no-progress

      - name: Route -C dlltool to mingw-w64 dlltool (with self-test)
        run: |
          $dt = Get-ChildItem "C:\ProgramData\mingw64","C:\ProgramData\chocolatey\lib\mingw" -Recurse -Filter dlltool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dt) { $c = Get-Command dlltool.exe -ErrorAction SilentlyContinue; if ($c) { $dt = $c.Source } }
          if (-not $dt) { throw "mingw-w64 dlltool.exe not found after choco install" }
          Write-Host "dlltool = $dt"
          & $dt --version
          $t = "$env:TEMP\dt-verify"
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          Set-Content -Path "$t\kernel32.dll_imports.def" -Value "LIBRARY kernel32.dll`nEXPORTS`n  CreateMutexW"
          & $dt -d "$t\kernel32.dll_imports.def" -D kernel32.dll -l "$t\kernel32.dll_imports.lib" -m i386:x86-64 -f --64 --no-leading-underscore --temp-prefix kernel32.dll
          if ($LASTEXITCODE -ne 0) { throw "dlltool self-test exit = $LASTEXITCODE ($dt)" }
          $lib = Get-Item "$t\kernel32.dll_imports.lib" -ErrorAction SilentlyContinue
          if (-not $lib -or $lib.Length -eq 0) { throw "dlltool self-test produced no/empty import library ($dt)" }
          Write-Host "dlltool self-test OK ($($lib.Length) bytes)"
          $root = Split-Path (Split-Path $dt)
          $targetLib = Get-ChildItem $root -Recurse -Filter libshlwapi.a -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $targetLib) { throw "libshlwapi.a not found anywhere under $root (mingw-w64 layout drift?)" }
          $shim = "$env:TEMP\mingw-extra-libs"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          $exclude = @('libmsvcrt\.a$','libmingwex\.a$','libmingw32\.a$','libm\.a$','libgcc.*\.a$','libpthread\.a$','libwinpthread.*\.a$','libmoldname.*\.a$','libiconv\.a$','libstdc\+\+\.a$')
          $copied = Get-ChildItem $targetLib -Filter *.a | Where-Object { $n = $_.Name; -not ($exclude | Where-Object { $n -match $_ }) } | Copy-Item -Destination $shim -Force -PassThru
          if (-not $copied -or $copied.Count -lt 10) { throw "shim copy yielded only $(@($copied).Count) libs from $targetLib" }
          Write-Host "shim dir = $shim ($(@($copied).Count) import libs, CRT excluded)"
          Add-Content $env:GITHUB_ENV "RUSTFLAGS=-C link-self-contained=yes -C dlltool=$dt -C link-arg=-L$shim"
          Write-Host "RUSTFLAGS routed via GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 金图正典 = CI runner（2026-10-31 迁移记档）：GH Windows 镜像 10-25
      # 轮换后 WARP 文字光栅化漂移，与 10-25 金图 ~700-9900 像素/图失配
      # （本机对旧金图 6/6 全绿 = 漂移在 runner 侧；windows-2022/latest 同款
      # = 钉扎不成立；kittest max_failed_pixels 文档红线弃用）。现行金图 =
      # R9（run 41157013020）于本 job 重生成后入库；新金图重生成流程 =
      # 临时换 UPDATE_SNAPSHOTS=1 + base64 落日志回传（28ce0b6 先例）→
      # 解码入库 → 还原本步。本机 opt-in 比对失配属已知环境差异（测试模块
      # 头注记记档），护栏职责由本 job 独担。
      - name: Snapshot tests (golden comparison)
        run: cargo test -p dd-gui --lib snapshot -- --ignored

  # §4.5（dd-run-改进分析.md）：性能趋势回归——PR base 与 head 各跑一遍
  # criterion bench（fast 参数压时长），共享 CARGO_TARGET_DIR 后用
  # tools/bench_compare.mjs 比中位数，退化 >20% 才红（runner 裸机噪音大，
  # 高阈值防误报）。**continue-on-error 观察模式**：runner 噪音分布未经
  # 实测，首绿观察后转阻塞（与 B1 snapshot 同节奏）；仅 PR 触发（push 全量
  # 跑双份 bench 纯烧时间，main 上的性能回归由 PR 阶段拦下）。
  bench:
    name: perf trend (linux, base vs head)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: github.event_name == 'pull_request'
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致）+ 覆盖 rust-toolchain.toml。
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Checkout PR base as sibling worktree
        run: git worktree add ../dd-run-base "${{ github.event.pull_request.base.sha }}"

      # 两棵树共用绝对 target 目录：依赖只编一次，两份基线落同一 criterion/ 下。
      - name: Bench (PR base)
        run: >
          cd ../dd-run-base &&
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench
          -p dd-gui -p dd-protocol --bench hot_paths --bench decoder --
          --save-baseline base --warm-up-time 1 --measurement-time 2 --sample-size 20

      - name: Bench (PR head)
        run: >
          cargo bench
          -p dd-gui -p dd-protocol --bench hot_paths --bench decoder --
          --save-baseline head --warm-up-time 1 --measurement-time 2 --sample-size 20

      - name: Compare medians (>20% regression fails)
        run: node tools/bench_compare.mjs target/criterion base head --threshold 20

  check-macos:
    name: build / test (macos, O6 gate)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # 显式钉宿主三元组（§5.7 去 pin 后与宿主默认一致，保留为防漂移的显式声明）。
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      # A1：同 check-linux——覆盖仓库 rust-toolchain.toml，维持零变化。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # A3：同 check-linux——三平台 clippy 同门禁（aarch64-apple-darwin 已实测 0 告警）。
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc

      - name: Roundtrip smoke (spawn, sample extension)
        run: cargo run -p dd-run-cli -- --roundtrip
