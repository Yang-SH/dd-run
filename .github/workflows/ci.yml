name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: build / test / clippy / fmt (windows-gnu)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable-x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 仓库 .cargo/config.toml 默认 target = x86_64-pc-windows-gnu，
      # rustup 的 gnu 工具链自带 self-contained 链接器，runner 无需外部 mingw。
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # 机器相关的 Steam 测试已更名 machine_steam_... 且 #[ignore]（apps.rs，
      # P8 收口：本机断言由维护者 `cargo test -p dd-ext -- --ignored machine_`
      # 真机覆盖），CI 无例外全跑。
      - name: Test (workspace)
        run: cargo test --workspace

      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

  # O3 依赖治理（docs/optimization-plan.md §2.5）：与平台无关，放 linux runner 最快。
  # - cargo-audit：RustSec 漏洞扫描，发现 vulnerability 即失败（默认门槛；unmaintained/
  #   informational 只警告不阻塞，避免第三方仓库的软性告警卡死 CI）。
  # - cargo-machete：死依赖检测（O3 原方案是 cargo-udeps，但它需要 nightly 工具链且
  #   每次冷编译整个依赖树，CI 成本高；machete 基于 identifier 匹配、stable 秒级，
  #   对本项目规模足够——若出现误报，用 workspace 层的 [package.metadata.ignore] 豁免）。
  audit:
    name: dependencies (audit + machete)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit & cargo-machete (prebuilt)
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-machete

      - name: Security audit (RustSec advisory-db)
        run: cargo audit

      - name: Unused dependencies
        run: cargo machete

  # O6 首批（2026-10-11）：三方平台构建矩阵——build/test/conformance 在
  # ubuntu/macOS 为**阻塞门禁**（探索轮两处平台缺口修复后全绿，已摘
  # continue-on-error）。clippy/fmt 仍以 Windows 门禁为准（避免跨平台 lint
  # 噪音稀释既有门禁语义）。
  check-linux:
    name: build / test (linux, O6 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
        env:
      # 仓库 .cargo/config.toml 硬编码 build.target = x86_64-pc-windows-gnu
      # （本地单平台开发口径）——CI 探索批用 env 覆盖回宿主三元组，否则
      # 非 Windows runner 上连 windows-gnu 的 std 都没有（E0463）。
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc

  check-macos:
    name: build / test (macos, O6 gate)
    runs-on: macos-latest
    timeout-minutes: 30
        env:
      # 同上：覆盖 config.toml 的 windows-gnu 默认目标。
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Test (workspace)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test_output.txt

      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "panicked at|test result: FAILED|---- .* stdout ----" test_output.txt | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -n 40 test_output.txt

      - name: Conformance smoke (calc, in-process)
        run: cargo run -p dd-run-cli -- --conformance --ext-id com.ddrun.calc
