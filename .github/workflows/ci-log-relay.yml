name: ci-log-relay

# 临时诊断工作流（O6 探索批，用后即删）：CI 失败时把失败 job 的构建错误
# 片段提交回仓，供无 API 凭据的维护会话匿名读取（2026-10-06 O9 CI #58 先例）。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  relay:
    # 探索批 continue-on-error 使整体结论恒 success——这里只看 head_branch，
    # 失败与否由脚本按作业级 conclusion 判定（无失败则静默退出）。
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract failed-job build errors
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p .ci-logs
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok = os.environ["GH_TOKEN"]; sha = os.environ["HEAD_SHA"]
          repo = "Yang-SH/dd-run"
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              return urllib.request.urlopen(req).read()
          runs = json.loads(get(f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=10"))
          ci_runs = [r for r in runs["workflow_runs"] if r["name"] == "CI"]
          os.makedirs(".ci-logs", exist_ok=True)
          relayed = 0
          for r in ci_runs:
              jobs = json.loads(get(r["jobs_url"]))
              for j in jobs["jobs"]:
                  if j["conclusion"] != "failure": continue
                  name = j["name"].replace(" ", "_").replace("/", "-")
                  logs = get(j["logs_url"]).decode("utf-8", "replace")
                  lines = logs.splitlines()
                  errs = [l for l in lines if "error[" in l or "] error" in l or l.rstrip().endswith("error:")]
                  picked = []
                  for k, l in enumerate(lines):
                      if "error[" in l or "error:" in l or "panicked at" in l:
                          picked += lines[k:k+5]
                  body = "
".join(picked[-120:]) or "
".join(lines[-60:])
                  with open(f".ci-logs/{name}.txt", "w") as f: f.write(body)
                  relayed += 1
          print("relayed", relayed)
          PYEOF
          ls -la .ci-logs/ || true
      - name: Commit relayed logs
        run: |
          git config user.name "ci-log-relay"
          git config user.email "noreply@github.com"
          git add .ci-logs || true
          if git diff --cached --quiet; then echo "no logs relayed"; exit 0; fi
          git commit -m "chore(temp): CI 失败日志搬运（[skip ci]，诊断后删除）"
          git push
